# teleop_twist_joy config for SHANWAN Android Gamepad
# Mapping verified 2026-07-14 — see docs/vault/mpi/Slice-4/Progress.md
# Mecanum kinematics enabled 2026-07-19 — see docs/vault/mpi/Slice-5/
#
# Axis map (0-indexed):
#   0: X    — Left stick H  (right = -1.0, left = +1.0)  INVERTED
#   1: Y    — Left stick V  (up = +1.0, down = -1.0)
#   2: Z    — Right stick H (right = -1.0, left = +1.0)  INVERTED
#   3: Rz   — Right stick V (up = +1.0, down = -1.0)
#   4: Gas  — R2 trigger (rest +1.0, pressed -1.0)
#   5: Brake— L2 trigger (rest +1.0, pressed -1.0)
#   6: Hat0X— D-pad H (left = +1.0, right = -1.0)       INVERTED
#   7: Hat0Y— D-pad V (up = +1.0, down = -1.0)
#
# Button map (0-indexed):
#   0: A    1: B    3: X    4: Y
#   6: L1   7: R1   8: L2-btn  9: R2-btn
#   10: Select  11: Start  12: Mode
#   13: L-stick click  14: R-stick click
#
# Control scheme (Slice 5 — full Mecanum):
#   Left stick Y (axis 1)  → linear.x  (forward/back)
#   Left stick X (axis 0)  → angular.z (turn left/right)
#   Right stick X (axis 2) → linear.y  (strafe left/right)
#   R1 bumper (button 7)   → turbo (2× speed)
#   X button (button 3)    → emergency stop (latched, in motor_driver)
#
# Strafe sign convention (ROS REP-103: +y = left):
#   Stick right = axis 2 value -1.0
#   We want stick right → strafe right → linear.y negative
#   So scale_linear.y must be POSITIVE: (-1.0) * (+0.5) = -0.5 ✓
#
# Safety notes:
#   - A (0) deadman switch is disabled; spring-loaded sticks return to
#     zero when released, acting as a natural deadman.
#   - X (3) is the emergency stop: handled by motor_driver; press once to
#     latch stop, press again to clear.
#   - joy_node autorepeat_rate is set to 50 Hz in the launch file so
#     /cmd_vel keeps publishing even when the stick is held still.

teleop_twist_joy_node:
  ros__parameters:
    # --- Enable / turbo buttons ---
    # A deadman switch is disabled so the spring-loaded sticks act as the
    # natural deadman (they return to zero when released).  X on the
    # motor_driver is the emergency stop.
    require_enable_button: false
    enable_button: 0        # A button (unused when require_enable_button=false)
    enable_turbo_button: 7  # R1 bumper = turbo (faster)

    # --- Left stick → linear (forward/back) + angular (turn) ---
    # Axis 1 (Y) up = +1.0 → forward.  Scale 0.5 m/s.
    axis_linear.x: 1
    scale_linear.x: 0.5
    scale_linear_turbo.x: 1.0

    # Axis 0 (X) left = +1.0. Positive scale gives positive angular.z
    # (counter-clockwise / turn left), so stick left = turn left.
    axis_angular.yaw: 0
    scale_angular.yaw: 2.5
    scale_angular_turbo.yaw: 5.0

    # --- Right stick → strafe (lateral, Mecanum) ---
    # Axis 2 (Z) right = -1.0.  Positive scale → stick right produces
    # negative linear.y = strafe right (REP-103: +y = left).
    axis_linear.y: 2
    scale_linear.y: 0.5
    scale_linear_turbo.y: 1.0

    # Unused axes
    axis_linear.z: -1
    axis_angular.pitch: -1
    axis_angular.roll: -1

    # Don't publish TwistStamped (motor_driver expects Twist)
    publish_stamped_twist: false
